<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbine Alignment Pro</title>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0;
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --header: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155;
            --primary: #60a5fa; --success: #4ade80; --danger: #f87171; --header: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        .flex-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 20px; color: var(--primary); }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; }
        .section-title { font-weight: bold; font-size: 14px; color: var(--primary); margin-bottom: 15px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-calc { background: var(--primary); color: white; flex: 2; }
        .btn-reset { background: #64748b; color: white; }
        .btn-theme { background: var(--header); color: var(--text); border: 1px solid var(--border); }
        .results { display: none; margin-top: 25px; padding: 20px; border: 2px solid var(--success); border-radius: 10px; background: var(--card); }
        .res-card { background: var(--bg); padding: 12px; border-radius: 6px; margin-bottom: 10px; border-right: 4px solid var(--primary); }
        body[dir="ltr"] .res-card { border-right: none; border-left: 4px solid var(--primary); }
        .res-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); }
        .res-row span { font-weight: bold; color: var(--danger); }
        .svg-container { margin-top: 15px; background: white; border-radius: 8px; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="flex-header">
        <h1 id="t-title">محاذاة التوربين والمولد</h1>
        <div style="display: flex; gap: 8px;">
            <select id="lang" onchange="updateLang()" style="width: 80px;">
                <option value="ar">AR</option>
                <option value="en">EN</option>
                <option value="fr">FR</option>
            </select>
            <button class="btn-theme" onclick="toggleTheme()">🌓</button>
        </div>
    </div>

    <!-- 1. الأبعاد والنوع -->
    <div class="section">
        <div class="section-title">⚙️ <span id="t-s1">الإعدادات الهندسية</span></div>
        <div class="grid">
            <div><label id="t-l-legs">عدد الأرجل</label><select id="legs" onchange="drawLegInputs()"><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></div>
            <div><label id="t-l-dia">قطر القارنة (D)</label><input type="number" id="dia" value="625"></div>
            <div><label id="t-l-l1">القارنة إلى أول رجل (L1)</label><input type="number" id="l1" value="660"></div>
        </div>
        <div id="extra-legs" class="grid" style="margin-top: 15px;"></div>
    </div>

    <!-- 2. أهداف المصنع (Target) -->
    <div class="section" style="background: rgba(37, 99, 235, 0.05);">
        <div class="section-title">🎯 <span id="t-s2">أهداف المصنع (Target)</span></div>
        <div class="grid">
            <div><label id="t-l-t-v">الارتفاع المطلوب (V Offset) μm</label><input type="number" id="t-v" value="0"></div>
            <div><label id="t-l-t-f">فجوة الوجه المطلوبة (Face Gap) mm</label><input type="number" id="t-f" value="0"></div>
        </div>
    </div>

    <!-- 3. القراءات الحالية -->
    <div class="section">
        <div class="section-title">📏 <span id="t-s3">القراءات الحالية (Rim/Face)</span></div>
        <div class="grid" style="margin-bottom: 15px;">
            <div><label>Rim 0°</label><input type="number" id="r0" value="900"></div>
            <div><label>Rim 90°</label><input type="number" id="r90" value="562"></div>
            <div><label>Rim 180°</label><input type="number" id="r180" value="306"></div>
            <div><label>Rim 270°</label><input type="number" id="r270" value="637"></div>
        </div>
        <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px;">Face Gap (mm):</div>
        <div class="grid">
            <div><label>Top (0°)</label><input type="number" id="f0" value="11.75"></div>
            <div><label>Bottom (180°)</label><input type="number" id="f180" value="12.25"></div>
            <div><label>Right (90°)</label><input type="number" id="f90" value="12.00"></div>
            <div><label>Left (270°)</label><input type="number" id="f270" value="12.00"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="calculate()" id="t-b-c">احسب الناتج</button>
        <button class="btn-reset" onclick="location.reload()" id="t-b-r">تصفير</button>
    </div>

    <div id="res-box" class="results">
        <h3 id="t-res-h">📋 التقرير النهائي</h3>
        <div class="res-card">
            <div id="v-list"></div>
        </div>
        <div class="res-card" style="border-right-color: #64748b;">
            <div class="res-row"><span id="t-h-move">الحركة الأفقية:</span> <b id="h-val">0</b></div>
        </div>
        <div class="svg-container" id="svg-area"></div>
    </div>
</div>

<script>
const i18n = {
    ar: { title: "محاذاة التوربين والمولد", s1: "الإعدادات الهندسية", l_legs: "عدد الأرجل", l_dia: "قطر القارنة", l_l1: "من القارنة لأول رجل", s2: "أهداف المصنع (Target)", l_t_v: "الارتفاع المطلوب μm", l_t_f: "فجوة الوجه mm", s3: "القراءات الحالية", b_c: "احسب الناتج", b_r: "تصفير", res_h: "📋 التقرير النهائي", h_move: "الحركة الأفقية:", leg: "رجل", add: "إضافة (+)", rem: "إزالة (-)" },
    en: { title: "Turbine Alignment App", s1: "Geometry", l_legs: "Feet Count", l_dia: "Coupling Dia", l_l1: "Cpl to Foot 1", s2: "Manufacturer Targets", l_t_v: "Target Offset μm", l_t_f: "Target Gap mm", s3: "Current Readings", b_c: "Calculate", b_r: "Reset", res_h: "📋 Final Report", h_move: "Horizontal Move:", leg: "Foot", add: "Add (+)", rem: "Remove (-)" },
    fr: { title: "Lignage de Turbine", s1: "Géométrie", l_legs: "Nb de Pieds", l_dia: "Dia Accoupl.", l_l1: "Acc. au Pied 1", s2: "Cibles Constructeur", l_t_v: "Offset Cible μm", l_t_f: "Gap Cible mm", s3: "Lectures Actuelles", b_c: "Calculer", b_r: "Reset", res_h: "📋 Rapport Final", h_move: "Mouvement Horiz:", leg: "Pied", add: "Ajouter (+)", rem: "Retirer (-)" }
};

function updateLang() {
    const l = document.getElementById('lang').value;
    document.dir = l === 'ar' ? 'rtl' : 'ltr';
    const d = i18n[l];
    document.getElementById('t-title').innerText = d.title;
    document.getElementById('t-s1').innerText = d.s1;
    document.getElementById('t-l-legs').innerText = d.l_legs;
    document.getElementById('t-l-dia').innerText = d.l_dia;
    document.getElementById('t-l-l1').innerText = d.l_l1;
    document.getElementById('t-s2').innerText = d.s2;
    document.getElementById('t-l-t-v').innerText = d.l_t_v;
    document.getElementById('t-l-t-f').innerText = d.l_t_f;
    document.getElementById('t-s3').innerText = d.s3;
    document.getElementById('t-b-c').innerText = d.b_c;
    document.getElementById('t-b-r').innerText = d.b_r;
    document.getElementById('t-res-h').innerText = d.res_h;
    document.getElementById('t-h-move').innerText = d.h_move;
    drawLegInputs();
}

function toggleTheme() {
    const b = document.body;
    b.getAttribute('data-theme') === 'dark' ? b.removeAttribute('data-theme') : b.setAttribute('data-theme', 'dark');
}

function drawLegInputs() {
    const n = parseInt(document.getElementById('legs').value);
    const cont = document.getElementById('extra-legs');
    cont.innerHTML = '';
    for(let i=2; i <= n/2; i++) {
        cont.innerHTML += `<div><label>L${i} (mm)</label><input type="number" id="dist${i}" value="${i*1500}"></div>`;
    }
}

function calculate() {
    const l = document.getElementById('lang').value;
    const dia = parseFloat(document.getElementById('dia').value);
    const l1 = parseFloat(document.getElementById('l1').value);
    const targetV = parseFloat(document.getElementById('t-v').value) / 1000;
    const targetF = parseFloat(document.getElementById('t-f').value);

    const r0 = parseFloat(document.getElementById('r0').value) / 1000;
    const r180 = parseFloat(document.getElementById('r180').value) / 1000;
    const currentVOffset = (r0 - r180) / 2;
    const vOffsetCorr = currentVOffset - targetV;

    const f0 = parseFloat(document.getElementById('f0').value);
    const f180 = parseFloat(document.getElementById('f180').value);
    const currentGap = f180 - f0;
    const vGapCorr = currentGap - targetF;

    const n = parseInt(document.getElementById('legs').value);
    let dists = [l1];
    let currentD = l1;
    for(let i=2; i <= n/2; i++) {
        let val = parseFloat(document.getElementById('dist'+i).value);
        currentD += val;
        dists.push(currentD);
    }

    const vCont = document.getElementById('v-list');
    vCont.innerHTML = '';
    let results = [];
    dists.forEach((d, i) => {
        let shim = vOffsetCorr + (vGapCorr * d / dia);
        results.push(shim);
        vCont.innerHTML += `<div class="res-row">${i18n[l].leg} ${i+1}: <span>${Math.abs(shim).toFixed(2)} mm ${shim >=0 ? i18n[l].add : i18n[l].rem}</span></div>`;
    });

    const hOffset = (parseFloat(document.getElementById('r270').value) - parseFloat(document.getElementById('r90').value)) / 2000;
    document.getElementById('h-val').innerText = Math.abs(hOffset).toFixed(3) + " mm";
    
    document.getElementById('res-box').style.display = 'block';
    drawSVG(results);
}

function drawSVG(shims) {
    const area = document.getElementById('svg-area');
    let legs = shims.map((s, i) => `<rect x="${150 + i*70}" y="100" width="20" height="20" fill="${s>=0?'#16a34a':'#dc2626'}"/><text x="${150 + i*70}" y="135" font-size="10">${Math.abs(s).toFixed(1)}</text>`).join('');
    area.innerHTML = `<svg width="500" height="150" viewBox="0 0 500 150">
        <rect x="10" y="70" width="80" height="20" fill="#94a3b8"/>
        <rect x="90" y="50" width="10" height="60" fill="#475569"/>
        <rect x="110" y="50" width="10" height="60" fill="#2563eb"/>
        <rect x="120" y="70" width="350" height="20" fill="#60a5fa" rx="5"/>
        ${legs}
    </svg>`;
}

window.onload = updateLang;
</script>
</body>
</html>
